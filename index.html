<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card do Batman</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <img src="img/batman.jpg" alt="Batman">

        <h1>Batman</h1>
        <p class="tipo">Herói</p>

        <h3>Força</h3>
        <div class="barra">
            <div class="forca"></div>
        </div>

        <h3>Inteligência</h3>
        <div class="barra">
            <div class="inteligencia"></div>
        </div>

        <h3>Agilidade</h3>
        <div class="barra">
            <div class="agilidade"></div>
        </div>
    </div>

</body>
</html>
